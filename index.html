<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";
    // Код писать здесь
    const btnEl = document.querySelector('.add-form-button');
    btnEl.disabled = true;
    const inputEl = document.querySelector('.add-form-name');
    const commentsEl = document.querySelector('.comments');
    const newcomEl = document.querySelector('.add-form-text');
    inputEl.addEventListener('change', () => {
      if(inputEl.value.trim() === ""|| newcomEl.value.trim() === "") {
        btnEl.disabled = true;
      } else {
        btnEl.disabled = false;
      }
    });
    newcomEl.addEventListener('change', () => {
      if(newcomEl.value.trim() === "" || inputEl.value.trim() === "") {
        btnEl.disabled = true;
      } else {
        btnEl.disabled = false;
      }
    });
    btnEl.addEventListener('click', () => {
      if(inputEl.value.trim() === "" || newcomEl.value.trim() === "") {
        return false;
      }
      let currentDate = new Date().toLocaleString('ru-RU', {
        day: '2-digit', month: '2-digit', year: '2-digit', 
        hour: '2-digit', minute:'2-digit'
        }).replace(',', '');
      const newList = document.createElement('li');
      newList.classList.add('comment');
      newList.innerHTML = `
        <div class="comment-header">
          <div>${inputEl.value}</div>
          <div>${currentDate}</div>
        </div>
        <div class="comment-body">
          <div class="comment-text">
            ${newcomEl.value}
          </div>
        </div>
        <div class="comment-footer">
          <div class="likes">
            <span class="likes-counter">0</span>
            <button class="like-button"></button>
          </div>
        </div>
      `
      commentsEl.appendChild(newList);
    });
    console.log("It works!");
  </script>
</html>
