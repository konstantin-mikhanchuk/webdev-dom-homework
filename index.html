<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
    <script>
    "use strict";
    const btnEl = document.querySelector('.add-form-button');
    btnEl.disabled = true;
    const inputEl = document.querySelector('.add-form-name');
    const commentsEl = document.querySelector('.comments');
    const newcomEl = document.querySelector('.add-form-text');
    inputEl.addEventListener('change', () => {
      if(inputEl.value.trim() === ""|| newcomEl.value.trim() === "") {
        btnEl.disabled = true;
      } else {
        btnEl.disabled = false;
      }
    });
    newcomEl.addEventListener('change', () => {
      if(newcomEl.value.trim() === "" || inputEl.value.trim() === "") {
        btnEl.disabled = true;
      } else {
        btnEl.disabled = false;
      }
    });
    const commentsArray = [
      {name: "Глеб Фокин",
       date: "12.02.22 12:18",
       comment: "Это будет первый комментарий на этой странице",
       likesCount: 3,
       likesPresence: false
      },
      {name: "Варвара Н.",
       date: "13.02.22 19:22",
       comment: "Мне нравится как оформлена эта страница! ❤",
       likesCount: 75,
       likesPresence: true
      }
    ];
    const renderComments = () => {
      const commentsHtml = commentsArray.map((comment, index) => {
        return `
         <li class="comment">
          <div class="comment-header">
            <div>${comment.name}</div>
            <div>${comment.date}</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              ${comment.comment}
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">${comment.likesCount}</span>
              <button data-index="${index}" class="like-button ${comment.likesPresence ? " -active-like" : ""}"></button>
            </div>
          </div> 
         </li>
        `
      }).join("");
      commentsEl.innerHTML = commentsHtml;
      const likesElements = document.querySelectorAll(".like-button");
      for (const likesElement of likesElements) {
        likesElement.addEventListener("click", () => {
          const index = likesElement.dataset.index;
          const comment = commentsArray[index]
          if(comment.likesPresence === true) {
            comment.likesPresence = false;
            comment.likesCount--;
          } else {
            comment.likesPresence = true;
            comment.likesCount++;
          }
          renderComments();
        });
      };
    }
    renderComments();
    btnEl.addEventListener('click', () => {
      if(inputEl.value.trim() === "" || newcomEl.value.trim() === "") {
        return false;
      }
      let currentDate = new Date().toLocaleString('ru-RU', {
        day: '2-digit', month: '2-digit', year: '2-digit', 
        hour: '2-digit', minute:'2-digit'
      }).replace(',', '');
      const newObject = { 
       name: inputEl.value,
       date: currentDate,
       comment: newcomEl.value,
       likesCount: 0,
       likesPresence: false 
      };
      commentsArray.push(newObject);
      renderComments();
    });
    </script>
  </body>
</html>
